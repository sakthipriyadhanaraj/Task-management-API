  services:
    mysql:
      image: mysql:8.4
      environment:
        MYSQL_DATABASE: task_manager
        MYSQL_USER: taskapp
        MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      ports:
        - "127.0.0.1:3308:3306"
      volumes:
        - task_mysql_data:/var/lib/mysql

  volumes:
    task_mysql_data:
